name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    env:
      CBOM_REQUIRE_JAVA: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.python == '3.10' && '17' || '21' }}
      - name: Install
        run: python -m pip install -e '.[dev]' pytest-cov
      - name: Test
        run: python -m pytest --cov=. --cov-report=xml:coverage.xml
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Lint
        run: python -m ruff check src tests benchmarks examples
      - name: CLI smoke
        run: python -m cbom demo --output outputs/ci-demo.json
      - name: Java CLI smoke
        run: java -jar java/build/cbom.jar demo --output outputs/ci-java-demo.json
      - name: Build distribution
        run: python -m build
